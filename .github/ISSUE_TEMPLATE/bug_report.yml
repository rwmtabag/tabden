name: Bug report
description: Something in tabden didn't work as described
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of tabden doctor
      description: >-
        Run `tabden doctor` in Termux and paste everything it prints. It leaves
        out your username, git identity and timezone, but read it once before
        posting. If tabden isn't installed yet, say so and paste the last lines
        the installer printed instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Error messages help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. tabden install custom
        2. ...
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Pixel Tablet, 8 GB
