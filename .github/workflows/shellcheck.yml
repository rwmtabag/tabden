name: shellcheck

# The same checks contributors run locally (see docs/design.md):
#   for f in launcher.sh guest.sh tools/record-demo.sh; do bash -n "$f"; done
#   shellcheck -S warning launcher.sh guest.sh tools/record-demo.sh

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: |
          bash -n launcher.sh
          bash -n guest.sh
          bash -n tools/record-demo.sh

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning launcher.sh guest.sh tools/record-demo.sh
